# Tema Rakfilm (K51): hitam hangat / kertas hangat, satu aksen oranye, IBM Plex. Pengguna bisa memilih
# terang atau gelap di menu Settings; tampilan awal mengikuti setelan sistem pengguna.

[server]
enableStaticServing = true  # folder static/: font Anton untuk wordmark dan judul film, logo

[theme]
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseRadius = "6px"
buttonRadius = "6px"
showSidebarBorder = false

[[theme.fontFaces]]
family = "Anton"
url = "app/static/fonts/Anton-Regular.ttf"
weight = 400

# Teks tombol utama Streamlit selalu putih, jadi oranye tombol dipilih yang lolos kontras 4,5:1 untuk teks putih.
[theme.light]
primaryColor = "#C2410C"
backgroundColor = "#F4F1EC"
secondaryBackgroundColor = "#E9E4DC"
textColor = "#151412"
borderColor = "#D6D0C6"
linkColor = "#C2410C"

[theme.light.sidebar]
backgroundColor = "#EDE8E0"
secondaryBackgroundColor = "#E2DCD3"

[theme.dark]
primaryColor = "#D2430E"
backgroundColor = "#0E0D0C"
secondaryBackgroundColor = "#1E1C1A"
textColor = "#EDEAE4"
borderColor = "#2E2B28"
linkColor = "#F2531B"

[theme.dark.sidebar]
backgroundColor = "#161513"
secondaryBackgroundColor = "#1E1C1A"
